# My Food App API tester (web app). Separate compose project: starting or
# stopping it never touches the backend's containers. It joins the backend's
# Docker network (external) and reaches the API by service name.
#
#   docker compose up -d --build              # http://localhost:4200
#   ./scripts/run-all-tests.sh                # every API, page and quality test
#
# The backend stack must already be running (its network must exist). The
# test runners live in docker-compose.tests.yml, the test-only backend in
# docker-compose.apitest.yml.

name: myfoodapp-sample-frontend

services:
  web:
    build: .
    image: myfoodapp-sample-frontend:local
    environment:
      # the API as seen from this container (service name on the backend network)
      API_BASE_URL: ${API_BASE_URL:-http://api:9595}
    ports:
      - "${WEB_PORT:-4200}:80"
    volumes:
      # the Test Dashboard reads the latest results from here
      - ./test-results:/usr/share/nginx/test-results:ro
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-myfoodapp_default}
